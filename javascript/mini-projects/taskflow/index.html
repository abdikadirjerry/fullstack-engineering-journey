<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaskFlow is a simple and modern task management application."
    />
    <title>TaskFlow | Smart Task Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header class="app-header">
      <a href="#" class="logo" aria-label="TaskFlow home">
        <span class="logo-icon">✓</span>
        <span>TaskFlow</span>
      </a>

      <p class="header-subtitle">Organize your day, your way.</p>
    </header>

    <main class="app-container">
      <section class="welcome-section">
        <p class="eyebrow">YOUR PRODUCTIVITY SPACE</p>
        <h1>Manage your tasks</h1>
        <p class="welcome-description">
          Stay organized, focus on what matters, and get things done.
        </p>
      </section>

      <section class="task-section" aria-label="Task manager">
        <div class="task-panel">
          <h2>My Tasks</h2>
          <p>Your personal task manager is ready.</p>

          <div id="app-message" class="app-message" aria-live="polite">
            Welcome to TaskFlow!
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>TaskFlow &copy; 2026. Stay focused and productive.</p>
    </footer>
  </body>
</html>
